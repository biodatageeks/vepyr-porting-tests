[project]
name = "vepyr-port-tools"
version = "0.1.0"
description = "Tooling for curated VEP→vepyr data-problem porting tests"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools"]
pythonpath = ["tools"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ISC", "RUF", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pins"]

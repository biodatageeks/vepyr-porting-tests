name = "runner_ref_eq_alt_test6"
description = "Fixture covering 1 test. Compare the complete output body with expected_output.vcf."

[[tests]]
id = "runner_ref_eq_alt_test6"
description = "vepyr annotates the upstream fixture test6.vcf (a REF==ALT record 21 25585733 C>C, then 22 25769065 G>T) to the same output body as native VEP 116 --everything: the REF==ALT record does not stop the run and the next record is annotated in full."
vep_test = "https://github.com/Ensembl/ensembl-vep/blob/release/116.0/t/Runner.t#L1134-L1148"

[input]
command = "bcftools norm -m -both -o <out.vcf> <in.vcf.gz>"
bcftools_version = "bcftools 1.23"

[vepyr]
flavour = "ensembl"
# Names the cache shards (chr21.parquet, chr22.parquet), not the input spelling; the input uses "21" and "22".
required_contigs = ["chr21", "chr22"]
everything = true
preserve_record_layout = true
reference_fasta = true

[vep]
image = "ensemblorg/ensembl-vep@sha256:f354dd8d09073e4d943acbbd02f5eb234a9d9e9d444371c1c349910f2123de11"
command = "vep --offline --cache --dir_cache /opt/vep/.vep --species homo_sapiens --cache_version 116 --assembly GRCh38 --fasta /opt/vep/fasta/Homo_sapiens.GRCh38.dna.primary_assembly.fa --everything --vcf --input_file input.vcf --output_file expected_output.vcf --force_overwrite"
date = "2026-10-01"
cache_source = "https://huggingface.co/datasets/biodatageeks/vepyr_116_GRCh38_ensembl/tree/15a048f0585a7a40d2d40cb1c2f7806638ee500b"
vep_cache = "https://ftp.ensembl.org/pub/release-116/variation/indexed_vep_cache/homo_sapiens_vep_116_GRCh38.tar.gz"
vep_cache_checksum = "sha256:014c7dd9bb5ad06665866d62eb80f31ca761197bcb9b59280300676f996e600d sum:56036 26996736"
fasta_source = "https://ftp.ensembl.org/pub/release-116/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz"
fasta_checksum = "sha256:d8c3af0094a7bba6125763bad779ec18a81483c739c6ed122094bdf86c187b92 sum:22450 861294"


name: test-index

# tests/INDEX.csv is generated by tools/build_test_index from every
# tests/data/*/test.toml (#92) and is never hand-edited. The job regenerates it in
# memory and fails when the committed file differs. No auto-regeneration, no bot
# commit: the author runs tools/build_test_index and commits the index.
# No path filter: the check always runs so it can be a required status, and the
# push run on master detects an index made stale by two racing merges.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Check tests/INDEX.csv is current
        run: tools/build_test_index --check

      # One VEP software pin (#239): every tests/data/*/test.toml and the repo text
      # must match tools/vep_pin.toml (VEP 116.2, cache 116), except the temporary
      # allow-list tools/vep_pin_legacy_allowlist.txt that #237 deletes.
      - name: Unit tests of tools/check_vep_version
        run: uv run --frozen pytest -q tools/test_check_vep_version.py

      - name: Check every data-test against the VEP pin
        run: tools/check_vep_version

name: Data-test
description: Port or track a curated data-test (not a product bug report)
title: "[data-test] "
labels: ["data-test"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to **port or track a data-test** in this repository.

        This is **not** a product bug report for vepyr. An engine defect that a data-test
        here exposes goes in the **Data problem report** (`[data]`) form; wrong annotation output
        with no data-test here goes upstream to
        [biodatageeks/vepyr](https://github.com/biodatageeks/vepyr).

        Put the tracking block (`### Acceptance criteria` with backticked commands,
        `blocks #N`, cause and pin lines) inside that form's *Description*; only the owner files
        upstream, agents never do.

        A data-test is one directory `tests/data/<slug>/` holding `input.vcf`,
        `expected_output.vcf` (native VEP 116.2 output) and `test.toml`. Each field
        below records the answer for one part of that directory or of the issue;
        the implementer transcribes it (the form writes nothing), and `test.toml`
        holds only the keys the loader accepts (`tests/data_dirs.rs`, README
        *Porting method*). All fields are required.

  - type: input
    id: dir-name
    attributes:
      label: Test directory name (slug)
      description: >-
        Becomes `tests/data/<slug>/` and the `name` key in `test.toml`.
      placeholder: "chr21_missense_snvs"
    validations:
      required: true

  - type: textarea
    id: vep-test-link
    attributes:
      label: VEP test link
      description: >-
        Tag `release/116.2` URL with a line range, plus the commit-pinned URL.
        Feeds `[origin] vep_test` and `vep_test_pinned`.
      placeholder: |
        https://github.com/Ensembl/ensembl-vep/blob/release/116.2/t/<File>.t#L10-L40
        https://github.com/Ensembl/ensembl-vep/blob/<commit>/t/<File>.t#L10-L40
    validations:
      required: true

  - type: input
    id: vep-subject-link
    attributes:
      label: VEP subject link
      description: >-
        Commit-pinned permalink (`blob/<40-hex commit>/...`, never a branch or tag) to the
        Perl module or method the VEP test exercises, with a line anchor. Feeds
        `[origin] vep_subject`; `tests/data_dirs.rs` rejects a `vep_subject` or
        `vep_test_pinned` that is not pinned to a full commit.
      placeholder: "https://github.com/Ensembl/ensembl-vep/blob/2cb0bbe216bb31c75de8f8000e2da7ff4fb7b451/modules/Bio/EnsEMBL/VEP/Runner.pm#L396"
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: One-sentence description
      description: >-
        Feeds `description` in `test.toml` (or the `[[property]]` `description` when the
        test's input and oracle equal an existing directory's: it is then added as a
        property of that directory, #238).
      placeholder: "Missense SNVs on chr21 get the same CSQ as VEP 116."
    validations:
      required: true

  - type: textarea
    id: vepyr-invocation
    attributes:
      label: How vepyr is called
      description: >-
        `everything`, `preserve_record_layout`, `reference_fasta`, flavour. Feeds `[vepyr]`; write it as TOML, with the types the loader expects.
      placeholder: |
        everything = true
        preserve_record_layout = true
        reference_fasta = true
        flavour = "ensembl"
    validations:
      required: true

  - type: textarea
    id: vepyr-code-links
    attributes:
      label: vepyr code links
      description: >-
        Links to the vepyr implementation code (source files, functions, or line
        ranges) this test specifically exercises. Required: if this test is a
        general/broad check not tied to particular code, state that explicitly
        (e.g. "general/broad check — no specific code target") instead of leaving
        it blank. Recorded in the issue only: `test.toml` has no key for it.
      placeholder: |
        https://github.com/biodatageeks/vepyr/blob/<commit>/src/<file>.rs#L100-L180
        or: general/broad check — no specific code target
    validations:
      required: true

  - type: input
    id: required-contigs
    attributes:
      label: Required contigs
      description: >-
        Exact contigs the test needs (comma-separated). Feeds
        `[vepyr] required_contigs`.
      placeholder: "chr21"
    validations:
      required: true

  - type: textarea
    id: input-source
    attributes:
      label: Input source (data provenance)
      description: >-
        Where the raw input VCF came from — link the source file, dataset, or cited
        fixture (it is normalised by `tools/normalize_input`, #85; per #90, the raw
        file itself is not committed to the repo, only this record of its origin).
        Feeds `input.vcf`.
      placeholder: |
        https://github.com/Ensembl/ensembl-vep/blob/release/116.2/t/testdata/input/test.vcf
    validations:
      required: true

  - type: textarea
    id: test-locus
    attributes:
      label: Test locus
      description: >-
        Links to the files (or cited fixtures), and which chromosome(s)/loci the
        tested data fragment covers — what data this test is about. Recorded in
        the issue only: `test.toml` has no key for it.
      placeholder: |
        chr21:25000000-26000000 (records 1-12 of the linked fixture)
    validations:
      required: true

  - type: textarea
    id: oracle-procedure
    attributes:
      label: Oracle procedure
      description: >-
        How VEP is run to produce the oracle: the procedure, or a link to where it
        is documented (e.g. "default `./bless` procedure, see #32"; state any
        extra flags, limited to `ALLOWED_VEP_FLAGS` in `tools/bless/vep.py`). Feeds `[vep]`.
      placeholder: |
        default ./bless procedure, see #32; extra flags: none
    validations:
      required: true

  - type: textarea
    id: verification-method
    attributes:
      label: Verification method
      description: >-
        How compliance with `expected_output.vcf` is checked: the default (#80's
        md5-of-body comparison), or a description/link to additional checks this
        test needs beyond the default (e.g. structural field assertions).
        Recorded in the issue only: `[compare]` holds just `body_md5`, written
        by `./bless`.
      placeholder: |
        default: md5 of body (#80)
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Numbered items, each with a backticked command. This heading is required
        by the issue gate.
        State what the command returns on the current master; a criterion that already passes on master gates nothing, unless it is labelled a regression guard.
      placeholder: |
        1. `./check_normalised_input` exits 0.
        2. `DATA_DIRS_ROOT=<scratch dir holding only tests/data/<slug>/> VEPYR_CACHE_ROOT=<cache> cargo test --test data_dirs data_dirs -- --nocapture` exits 0 (there is no per-directory filter; the runner walks every directory under `DATA_DIRS_ROOT`).
    validations:
      required: true

blank_issues_enabled: true
contact_links:
  - name: vepyr product bug not tied to a data-test here
    url: https://github.com/biodatageeks/vepyr/issues/new/choose
    about: >-
      Wrong, missing, or unexpected annotation output from the vepyr library itself that no
      data-test in this repository exposes. An engine defect that blocks a data-test here
      uses the Data problem report ([data]) form instead, with a `### Acceptance criteria`
      block in its Description. Only the owner files issues upstream; agents never do.
